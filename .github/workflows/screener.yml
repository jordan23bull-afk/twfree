name: Обновить data.json

on:
  schedule:
    # 00:10 по Москве: МСК = UTC+3 без перехода на летнее время, 21:10 UTC
    - cron: '10 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Собрать data.json
        run: node screener.mjs

      - name: Проверить, изменились ли данные
        id: check
        run: |
          git show HEAD:data.json > .prev.json 2>/dev/null || true
          if [ -s .prev.json ] && node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("data.json", "utf8"));
            const b = JSON.parse(fs.readFileSync(".prev.json", "utf8"));
            delete a.generated;
            delete b.generated;
            process.exit(JSON.stringify(a) === JSON.stringify(b) ? 0 : 1);
          '; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- data.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f .prev.json

      - name: Закоммитить и запушить
        if: steps.check.outputs.changed == 'true'
        run: |
          td=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("data.json", "utf8")).tradedate)')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Обновление данных скринера за $td"
          git push
